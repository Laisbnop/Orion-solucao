<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion - Entrar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <form id="loginForm" novalidate>
        <h1>Orion</h1>

        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" placeholder="Digite seu usuário" autocomplete="username">

        <label for="senha">Senha</label>
        <div class="campo-senha">
            <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password">
            <button type="button" class="mostrar" id="toggleSenha">Mostrar</button>
        </div>

        <label class="lembrar">
            <input type="checkbox" id="lembrar"> Lembrar meu usuário
        </label>

        <button type="submit" class="btn" id="btnEntrar">Entrar</button>

        <p class="mensagem erro" id="loginError"></p>
        <p class="mensagem sucesso" id="loginSucesso"></p>

        <p class="nota">Acesso restrito a usuários cadastrados pela Orion.</p>
    </form>

    <script src="js/dados.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
